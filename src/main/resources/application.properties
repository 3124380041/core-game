# Application Config
spring.application.name=turn-based-battle-game
server.port=8080

# H2 Database Config (In-memory for development)
spring.datasource.url=jdbc:h2:mem:gamedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Enable SQL initialization for dev seed data
spring.sql.init.mode=always

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.example=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
